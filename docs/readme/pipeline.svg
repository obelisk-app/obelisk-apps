<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Publishing an app: build, upload blobs to Blossom, sign a kind 32390 manifest. Playing it: the client lists manifests, pins the version in a kind 2390 create event, verifies every sha256 and runs the bundle in a network-less sandbox. Every move is a kind 2390 event the host signs and every client replays.">
